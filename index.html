<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lasers &amp; Feelings Companion</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Lasers &amp; Feelings</h1>
    <p class="subtitle">Companion app</p>
  </header>

  <main>
    <section class="card" id="character-card">
      <h2>Character</h2>
      <label class="field">
        <span>Name</span>
        <input id="name" type="text" maxlength="40" placeholder="e.g. Captain Nova" autocomplete="off">
      </label>
      <div class="row">
        <label class="field">
          <span>Style</span>
          <select id="style"><option value="">Choose…</option></select>
        </label>
        <label class="field">
          <span>Role</span>
          <select id="role"><option value="">Choose…</option></select>
        </label>
      </div>
      <label class="field">
        <span>Number</span>
        <select id="number">
          <option value="2">2 – best at Feelings</option>
          <option value="3">3</option>
          <option value="4">4</option>
          <option value="5">5 – best at Lasers</option>
        </select>
      </label>
      <p class="hint" id="save-status">Your character is saved in this browser automatically.</p>
    </section>

    <section class="card" id="roll-card">
      <h2>Roll</h2>
      <p class="summary" id="summary"></p>
      <div class="toggle" role="radiogroup" aria-label="Roll for">
        <label class="lasers"><input type="radio" name="mode" value="lasers" checked><span>Lasers</span></label>
        <label class="feelings"><input type="radio" name="mode" value="feelings"><span>Feelings</span></label>
      </div>
      <p class="hint" id="mode-hint"></p>
      <button id="roll-btn" class="roll-btn">Roll the die</button>
      <div id="dice" class="dice" aria-live="polite"></div>
      <p id="result" class="result"></p>
    </section>
  </main>

  <footer>
    <p>Based on <a href="https://johnharper.itch.io/lasers-feelings">Lasers &amp; Feelings</a> by John Harper.</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
